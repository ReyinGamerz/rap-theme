name: Validate Rapelz modular theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-theme-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check prototype JavaScript syntax
        run: node --check app.js
      - name: Validate prototype files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'id="backupRows"' index.html
          grep -q 'id="nodeFilter"' index.html
          grep -q 'href="#restore"' index.html
          grep -q 'id="toast"' index.html
          grep -q 'function renderWebhookSettings' app.js
          grep -q 'id="saveWebhook"' app.js
          grep -q 'id="testWebhook"' app.js
          grep -q 'Mode preview UI' app.js
      - name: Validate modular CSS graph and script syntax
        run: |
          bash -n pterodactyl/apply-modular-theme.sh
          bash -n pterodactyl/rollback-modular-theme.sh
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('pterodactyl/theme/manifest.json','utf8')); if(m.entry!=='entry.css'||!Array.isArray(m.styles)||m.styles.length===0) process.exit(1); for(const f of [m.entry,...m.styles]) if(!fs.existsSync('pterodactyl/theme/'+f)) { console.error('Missing theme file:',f); process.exit(1); }"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'pterodactyl/theme';
          const visited = new Set();
          function inspect(file) {
            const full = path.join(root, file);
            if (visited.has(full)) return;
            visited.add(full);
            const css = fs.readFileSync(full, 'utf8');
            for (const match of css.matchAll(/@import\s+(?:url\()?['"]([^'"]+)['"]\)?\s*;/g)) {
              const target = match[1];
              if (/^(https?:|data:)/i.test(target)) continue;
              const child = path.normalize(path.join(path.dirname(file), target));
              if (!fs.existsSync(path.join(root, child))) {
                console.error('Missing CSS import:', file, '->', target);
                process.exitCode = 1;
              } else {
                inspect(child);
              }
            }
          }
          inspect('entry.css');
          console.log('Validated', visited.size, 'modular React CSS files');

          // AdminLTE styles are split into source files in pterodactyl/admin,
          // then copied as rapelz-admin/ next to the deployed entry stylesheet.
          const adminEntry = fs.readFileSync('pterodactyl/admin-theme.css', 'utf8');
          const adminVisited = new Set();
          for (const match of adminEntry.matchAll(/@import\s+(?:url\()?['"]([^'"]+)['"]\)?\s*;/g)) {
            const target = match[1];
            const expected = target === 'rapelz-admin/tokens.css'
              ? 'pterodactyl/theme/tokens.css'
              : target.startsWith('rapelz-admin/')
                ? path.join('pterodactyl/admin', target.slice('rapelz-admin/'.length))
                : path.join('pterodactyl', target);
            if (!fs.existsSync(expected)) {
              console.error('Missing AdminLTE CSS import:', target, 'expected source:', expected);
              process.exitCode = 1;
            } else {
              adminVisited.add(expected);
            }
          }
          const adminSources = {
            'tokens.css': 'pterodactyl/theme/tokens.css',
            'base.css': 'pterodactyl/admin/base.css',
            'refinements.css': 'pterodactyl/admin/refinements.css',
          };
          for (const [name, source] of Object.entries(adminSources)) {
            if (!adminVisited.has(source)) {
              console.error('AdminLTE stylesheet is not imported:', name);
              process.exitCode = 1;
            }
          }
          console.log('Validated', adminVisited.size, 'modular AdminLTE CSS files');
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const tokenText = fs.readFileSync('pterodactyl/theme/tokens.css', 'utf8');
          const declared = new Set([...tokenText.matchAll(/(--rap-[\w-]+)\s*:/g)].map(m => m[1]));
          function cssFiles(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) return cssFiles(full);
              return entry.isFile() && entry.name.endsWith('.css') ? [full] : [];
            });
          }
          const sources = [
            ...cssFiles('pterodactyl/theme'),
            ...cssFiles('pterodactyl/admin'),
          ];
          let unresolved = 0;
          for (const file of sources) {
            const css = fs.readFileSync(file, 'utf8');
            for (const match of css.matchAll(/var\(\s*(--rap-[\w-]+)/g)) {
              if (!declared.has(match[1])) {
                console.error('Undefined Rapelz design token:', match[1], 'used in', file);
                unresolved += 1;
              }
            }
          }
          if (unresolved > 0) process.exit(1);
          console.log('Validated Rapelz design tokens across', sources.length, 'CSS files');
          NODE

  build-against-pterodactyl-1151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: v1.15.1
          path: panel
      - uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: v1.15.1
          path: panel-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: panel/yarn.lock
      - name: Apply overlay to isolated upstream source
        run: bash pterodactyl/apply-modular-theme.sh "$GITHUB_WORKSPACE/panel"
      - name: Verify overlay is idempotent
        run: |
          git -C panel diff --binary > /tmp/rapelz-overlay-first.diff
          bash pterodactyl/apply-modular-theme.sh "$GITHUB_WORKSPACE/panel"
          git -C panel diff --binary > /tmp/rapelz-overlay-second.diff
          diff -u /tmp/rapelz-overlay-first.diff /tmp/rapelz-overlay-second.diff
      - name: Verify upgrade from legacy v1 overlay
        run: |
          mkdir -p "$RUNNER_TEMP/rapelz-overlay-v1"
          ln -s "$GITHUB_WORKSPACE/pterodactyl/theme" "$RUNNER_TEMP/rapelz-overlay-v1/theme"
          ln -s "$GITHUB_WORKSPACE/pterodactyl/admin-theme.css" "$RUNNER_TEMP/rapelz-overlay-v1/admin-theme.css"
          git -C "$GITHUB_WORKSPACE" show e39e7e2e218d3c601282a7b982c49828cfb5fd46:pterodactyl/apply-modular-theme.sh > "$RUNNER_TEMP/rapelz-overlay-v1/apply-modular-theme.sh"
          bash "$RUNNER_TEMP/rapelz-overlay-v1/apply-modular-theme.sh" "$GITHUB_WORKSPACE/panel-upgrade"
          bash pterodactyl/apply-modular-theme.sh "$GITHUB_WORKSPACE/panel-upgrade"
          grep -q 'RAPELZ THEME TOKENS v2' "$GITHUB_WORKSPACE/panel-upgrade/tailwind.config.js"
          if grep -q 'RAPELZ THEME TOKENS v1' "$GITHUB_WORKSPACE/panel-upgrade/tailwind.config.js"; then
            echo "Legacy theme token marker was not upgraded."
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/panel-upgrade/public/themes/pterodactyl/css/rapelz-admin/tokens.css"
          test -f "$GITHUB_WORKSPACE/panel-upgrade/public/themes/pterodactyl/css/rapelz-admin/base.css"
          test -f "$GITHUB_WORKSPACE/panel-upgrade/public/themes/pterodactyl/css/rapelz-admin/refinements.css"
      - name: Install upstream dependencies
        working-directory: panel
        run: corepack yarn install --frozen-lockfile
      - name: TypeScript validation
        working-directory: panel
        run: corepack yarn tsc
      - name: ESLint validation
        working-directory: panel
        run: corepack yarn lint
      - name: Production-mode webpack compile without clean step
        working-directory: panel
        run: NODE_ENV=production corepack yarn webpack --mode production
