name: Validate Rapelz modular theme
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-theme-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check prototype JavaScript syntax
        run: node --check app.js
      - name: Validate prototype files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'id="backupRows"' index.html
          grep -q 'id="nodeFilter"' index.html
          grep -q 'href="#restore"' index.html
          grep -q 'id="toast"' index.html
          grep -q 'function renderWebhookSettings' app.js
          grep -q 'id="saveWebhook"' app.js
          grep -q 'id="testWebhook"' app.js
          grep -q 'Mode preview UI' app.js
      - name: Validate modular CSS graph and script syntax
        run: |
          bash -n pterodactyl/apply-modular-theme.sh
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('pterodactyl/theme/manifest.json','utf8')); if(m.entry!=='entry.css'||!Array.isArray(m.styles)||m.styles.length===0) process.exit(1); for(const f of [m.entry,...m.styles]) if(!fs.existsSync('pterodactyl/theme/'+f)) { console.error('Missing theme file:',f); process.exit(1); }"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'pterodactyl/theme';
          const visited = new Set();
          function inspect(file) {
            const full = path.join(root, file);
            if (visited.has(full)) return;
            visited.add(full);
            const css = fs.readFileSync(full, 'utf8');
            for (const match of css.matchAll(/@import\s+(?:url\()?['"]([^'"]+)['"]\)?\s*;/g)) {
              const target = match[1];
              if (/^(https?:|data:)/i.test(target)) continue;
              const child = path.normalize(path.join(path.dirname(file), target));
              if (!fs.existsSync(path.join(root, child))) {
                console.error('Missing CSS import:', file, '->', target);
                process.exitCode = 1;
              } else {
                inspect(child);
              }
            }
          }
          inspect('entry.css');
          console.log('Validated', visited.size, 'modular React CSS files');

          // AdminLTE styles are split into source files in pterodactyl/admin,
          // then copied as rapelz-admin/ next to the deployed entry stylesheet.
          const adminEntry = fs.readFileSync('pterodactyl/admin-theme.css', 'utf8');
          const adminVisited = new Set();
          for (const match of adminEntry.matchAll(/@import\\s+(?:url\\()?['"]([^'"]+)['"]\\)?\\s*;/g)) {
            const target = match[1];
            const expected = target.startsWith('rapelz-admin/')
              ? path.join('pterodactyl/admin', target.slice('rapelz-admin/'.length))
              : path.join('pterodactyl', target);
            if (!fs.existsSync(expected)) {
              console.error('Missing AdminLTE CSS import:', target, 'expected source:', expected);
              process.exitCode = 1;
            } else {
              adminVisited.add(expected);
            }
          }
          for (const f of ['tokens.css', 'base.css', 'refinements.css']) {
            if (!adminVisited.has(path.join('pterodactyl/admin', f))) {
              console.error('AdminLTE stylesheet is not imported:', f);
              process.exitCode = 1;
            }
          }
          console.log('Validated', adminVisited.size, 'modular AdminLTE CSS files');
          NODE

  build-against-pterodactyl-1151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pterodactyl/panel
          ref: v1.15.1
          path: panel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: panel/yarn.lock
      - name: Apply overlay to isolated upstream source
        run: bash pterodactyl/apply-modular-theme.sh "$GITHUB_WORKSPACE/panel"
      - name: Verify overlay is idempotent
        run: bash pterodactyl/apply-modular-theme.sh "$GITHUB_WORKSPACE/panel"
      - name: Install upstream dependencies
        working-directory: panel
        run: corepack yarn install --frozen-lockfile
      - name: TypeScript validation
        working-directory: panel
        run: corepack yarn tsc
      - name: ESLint validation
        working-directory: panel
        run: corepack yarn lint
      - name: Production-mode webpack compile without clean step
        working-directory: panel
        run: NODE_ENV=production corepack yarn webpack --mode production
